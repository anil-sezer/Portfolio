---
- name: Verify containerd is running
  ansible.builtin.systemd:
    name: containerd
  register: containerd_service
  failed_when: containerd_service.status.ActiveState != "active"
  become: true

- name: Print containerd version
  ansible.builtin.command: /usr/local/bin/containerd --version
  register: containerd_ver
  changed_when: false

- name: Print runc version
  ansible.builtin.command: /usr/local/sbin/runc --version
  register: runc_ver
  changed_when: false

- name: Show installed versions
  ansible.builtin.debug:
    msg:
      - "{{ containerd_ver.stdout | default('skipped in check mode') }}"
      - "{{ runc_ver.stdout | default('skipped in check mode') }}"
