---
- name: Prevent cloud-init from managing /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/cloud/cloud.cfg
    regexp: '^\s*- {{ item }}$'
    state: absent
  loop:
    - update_etc_hosts
    - manage_etc_hosts
  become: true

- name: Fail if the node IP address fact is not available
  ansible.builtin.fail:
    msg: >
      ansible_facts[default_ipv4][address] is not defined for {{ ansible_hostname }}.
      Make sure network facts are gathered (gather_facts: true) and
      the node has a default IPv4 address.
  when: ansible_facts['default_ipv4']['address'] is not defined

- name: Replace loopback hostname entry with real IP
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^127\\.0\\.1\\.1\\s+{{ ansible_facts['hostname'] | regex_escape }}(\\s|$)"
    line: "{{ ansible_facts['default_ipv4']['address'] }} {{ ansible_facts['hostname'] }}"
    state: present
  become: true
