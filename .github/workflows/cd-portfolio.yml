---
name: cd-portfolio

on:
  push:
    branches:
      - "prod"
    paths:
      - "src/**"
      - "protos/**"
      - "global.json"
      - "Directory.Packages.props"
      - "Portfolio.sln"
      - ".github/workflows/cd-portfolio.yml"
  workflow_dispatch:

concurrency:
  group: cd-portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out codebase
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private container registry
        if: ${{ vars.CD_ENABLED == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: imgregistry.anil-sezer.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push Portfolio.Ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Portfolio.Ui/Dockerfile
          platforms: linux/arm64
          push: ${{ vars.CD_ENABLED == 'true' }}
          tags: |
            imgregistry.anil-sezer.com/portfolio-ui:latest
            imgregistry.anil-sezer.com/portfolio-ui:${{ github.sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - name: Build & Push Portfolio.Grpc
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Portfolio.Grpc/Dockerfile
          platforms: linux/arm64
          push: ${{ vars.CD_ENABLED == 'true' }}
          tags: |
            imgregistry.anil-sezer.com/portfolio-grpc:latest
            imgregistry.anil-sezer.com/portfolio-grpc:${{ github.sha }}
          cache-from: type=gha,scope=grpc
          cache-to: type=gha,mode=max,scope=grpc

  deploy:
    name: Deploy to Raspberry Pi K8s Cluster
    needs: build-and-push
    if: ${{ vars.CD_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - name: Rollout restart frontend and grpc deployments
        run: |
          kubectl rollout restart deployment/frontend deployment/grpc -n portfolio

      - name: Verify zero-downtime rollout status
        run: |
          kubectl rollout status deployment/frontend -n portfolio --timeout=180s
          kubectl rollout status deployment/grpc -n portfolio --timeout=180s

      - name: Send Telegram deployment notification
        if: always()
        env:
          STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_BRANCH: ${{ github.ref_name }}
          COMMIT_ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.NOTIFICATION_TELEGRAM_API_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.NOTIFICATION_TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Telegram credentials (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID) not configured in repository secrets."
            exit 1
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"
          SAFE_MSG=$(printf '%s' "${COMMIT_MESSAGE:-Manual workflow dispatch}" | head -n 3 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          COMMIT_URL="${SERVER_URL}/${REPO}/commit/${COMMIT_SHA}"

          if [ "$STATUS" = "success" ]; then
            STATUS_HEADER="✅ <b>Portfolio Deployed Successfully</b>"
          else
            STATUS_HEADER="❌ <b>Portfolio Deployment Failed</b>"
          fi

          printf -v TEXT '%s\n\n<b>Repository:</b> %s\n<b>Branch:</b> <code>%s</code>\n' \
            "$STATUS_HEADER" "$REPO" "$COMMIT_BRANCH"
          printf -v TEXT '%s<b>Commit:</b> <a href="%s">%s</a>\n<b>Author:</b> %s\n' \
            "$TEXT" "$COMMIT_URL" "$SHORT_SHA" "$COMMIT_ACTOR"
          printf -v TEXT '%s<b>Run Details:</b> <a href="%s">View Action Run</a>\n\n<b>Message:</b>\n<i>%s</i>' \
            "$TEXT" "$RUN_URL" "$SAFE_MSG"

          curl -s -S --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}"
