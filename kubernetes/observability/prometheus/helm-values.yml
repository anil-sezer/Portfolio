# Configuration of subcharts defined in Chart.yaml

## alertmanager sub-chart configurable values
## Please see https://github.com/prometheus-community/helm-charts/tree/main/charts/alertmanager
##
# todo: Do it later
alertmanager:
  ## If false, alertmanager will not be installed
  ##
  enabled: true

  # Full external URL where alertmanager is reachable, used for backlinks.
  baseURL: "https://alertmanager.anilsezer.net"

  persistence:
    ## If true, storage will create or use Persistence Volume
    ## If false, storage will use emptyDir
    ##
    enabled: false

  podSecurityContext:
    runAsUser: 65534
    runAsNonRoot: true
    runAsGroup: 65534
    fsGroup: 65534

  ## Monitors ConfigMap changes and POSTs to /-/reload
  configmapReload:
    enabled: true

  ## Resource requests and limits tailored for Raspberry Pi worker nodes
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  ## Mount secret containing Telegram credentials
  extraSecretMounts:
    - name: telegram-secret
      mountPath: /etc/alertmanager/secrets
      subPath: ""
      secretName: alertmanager-telegram-secret
      readOnly: true

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "telegram-admin"
    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal:
          - alertname
          - namespace
    receivers:
      - name: "telegram-admin"
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/bot_token
            chat_id_file: /etc/alertmanager/secrets/chat_id
            parse_mode: "HTML"
            send_resolved: true
            message: |
              {{ if eq .Status "firing" }}🚨 <b>[FIRING - {{ .CommonLabels.severity | toUpper }}]</b>{{ else }}✅ <b>[RESOLVED]</b>{{ end }}
              <b>Alert:</b> {{ .CommonLabels.alertname }}
              {{ if .CommonLabels.namespace }}<b>Namespace:</b> {{ .CommonLabels.namespace }}
              {{ end }}{{ range .Alerts -}}
              <b>Summary:</b> {{ .Annotations.summary }}
              <b>Details:</b> {{ .Annotations.description }}
              {{ end }}

## kube-state-metrics sub-chart configurable values
## Please see https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-state-metrics
##
kube-state-metrics:
  ## If false, kube-state-metrics sub-chart will not be installed
  ##
  enabled: true

## prometheus-node-exporter sub-chart configurable values
## Please see https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus-node-exporter
##
prometheus-node-exporter:
  ## If false, node-exporter will not be installed
  ##
  enabled: true

  rbac:
    pspEnabled: false

  containerSecurityContext:
    allowPrivilegeEscalation: false

## prometheus-pushgateway sub-chart configurable values
## Please see https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus-pushgateway
##
prometheus-pushgateway:
  ## If false, pushgateway will not be installed
  ##
  enabled: false

  # Optional service annotations
  serviceAnnotations:
    prometheus.io/probe: pushgateway
