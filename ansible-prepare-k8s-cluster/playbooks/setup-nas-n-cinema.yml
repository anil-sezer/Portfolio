---
- name: Configure NAS storage mounts and NFS exports on cinema
  hosts: cinema
  become: true
  gather_facts: true
  tasks:
    - name: Install required NFS packages
      ansible.builtin.apt:
        pkg:
          - nfs-common
          - nfs-kernel-server
        update_cache: true
        state: present

    - name: Ensure /mnt/nas directory exists
      ansible.builtin.file:
        path: /mnt/nas
        state: directory
        mode: '0755'
        owner: root

    - name: Ensure /mnt/nas/ssd directory exists
      ansible.builtin.file:
        path: /mnt/nas/ssd
        state: directory
        mode: '0755'
        owner: root

    - name: Ensure /mnt/nas/disk directory exists
      ansible.builtin.file:
        path: /mnt/nas/disk
        state: directory
        mode: '0755'
        owner: root

    - name: Ensure /mnt/nas/ssd/k8s/db directory exists with postgres UID/GID 999
      ansible.builtin.file:
        path: /mnt/nas/ssd/k8s/db
        state: directory
        mode: '0777'
        owner: '999'
        group: '999'

    - name: Add NAS disk entry to /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^UUID=8e0824f3-f857-4ac2-8b62-0a8411fa6432\s+'
        line: "UUID=8e0824f3-f857-4ac2-8b62-0a8411fa6432 /mnt/nas/disk ext4 defaults 0 2"
        state: present
        backup: yes
      register: fstab_update

    - name: Verify fstab entry was added
      ansible.builtin.command: grep -Fx "UUID=8e0824f3-f857-4ac2-8b62-0a8411fa6432 /mnt/nas/disk ext4 defaults 0 2" /etc/fstab
      register: fstab_check
      changed_when: false
      failed_when:
        - fstab_check.rc != 0
        - fstab_update.changed  # Only fail if we just changed it but it's not there

    - name: Add bind mount for isolated PostgreSQL NFS export to /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/mnt/nas/ssd/k8s/db\s+/mnt/nas/ssd/k8s/db\s+'
        line: "/mnt/nas/ssd/k8s/db /mnt/nas/ssd/k8s/db none bind 0 0"
        state: present
        backup: yes

    - name: Test mount the filesystem
      ansible.builtin.command: mount -a
      register: mount_test
      changed_when: false
      failed_when: mount_test.rc != 0

    - name: Ensure mount points exist after mount
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /mnt/nas/disk
        - /mnt/nas/ssd

    - name: Configure NFS exports with root_squash isolation
      ansible.builtin.lineinfile:
        path: /etc/exports
        regexp: "^{{ item.path | regex_escape() }}\\s+"
        line: "{{ item.line }}"
        create: yes
        state: present
      loop:
        - path: /mnt/nas/disk
          line: '/mnt/nas/disk *(rw,sync,no_subtree_check,root_squash,anonuid=1000,anongid=1000)'
        - path: /mnt/nas/ssd
          line: '/mnt/nas/ssd *(rw,sync,no_subtree_check,no_root_squash,crossmnt)'
        - path: /mnt/nas/ssd/k8s/db
          line: '/mnt/nas/ssd/k8s/db *(rw,sync,no_subtree_check,root_squash,anonuid=999,anongid=999,fsid=1)'
      notify:
        - reload exports
        - restart nfs

    - name: Ensure NFS service is enabled and running
      ansible.builtin.systemd:
        name: nfs-kernel-server
        enabled: yes
        state: started

    - name: Re-export NFS shares cleanly
      ansible.builtin.command:
        cmd: exportfs -ra
      changed_when: false

  handlers:
    - name: reload exports
      ansible.builtin.command:
        cmd: exportfs -ra
      listen: "restart nfs"

    - name: restart nfs
      ansible.builtin.systemd:
        name: nfs-kernel-server
        state: restarted