---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc
  namespace: portfolio
spec:
  replicas: 2
  revisionHistoryLimit: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: grpc
  template:
    metadata:
      labels:
        app: grpc
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - grpc
                topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: regcred
      serviceAccountName: k8s-stats-service
      containers:
        - name: grpc
          image: imgregistry.anil-sezer.com/portfolio-grpc:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          startupProbe:
            grpc:
              port: 8080
              service: live
            timeoutSeconds: 5
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 8080
              service: live
            timeoutSeconds: 5
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 8080
              service: ready
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            - name: TZ
              value: "Europe/Istanbul"

            - name: OTEL_COLLECTOR_ENDPOINT
              value: "https://otel.anilsezer.net"

            - name: SQL_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: SQL_DB_HOST

            - name: SQL_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: SQL_DB_PORT

            - name: SQL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: SQL_DB_USER

            - name: SQL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: SQL_DB_PASSWORD

            - name: SQL_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: SQL_DB_NAME

            - name: NOTIFICATION_TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: NOTIFICATION_TELEGRAM_CHAT_ID

            - name: NOTIFICATION_TELEGRAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: NOTIFICATION_TELEGRAM_API_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi