---
# https://github.com/eza-community/eza
- name: Check if eza is already installed
  ansible.builtin.command: eza --version
  register: eza_check
  failed_when: false
  changed_when: false

- name: Install eza
  when: eza_check.rc != 0
  block:
    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      become: true

    - name: Download and install GPG key for eza repository
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/eza-community/eza/main/deb.asc
        dest: /tmp/eza.asc
        mode: '0644'
        timeout: 30
      register: gpg_download

    - name: Import GPG key to apt keyrings
      ansible.builtin.shell: |
        gpg --dearmor < /tmp/eza.asc > /etc/apt/keyrings/gierens.gpg
      args:
        creates: /etc/apt/keyrings/gierens.gpg
      become: true
      when: gpg_download is succeeded

    - name: Set correct permissions for GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings/gierens.gpg
        mode: '0644'
        owner: root
        group: root
      become: true

    - name: Add eza repository to sources list
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/gierens.gpg] http://deb.gierens.de stable main"
        filename: gierens
        state: present
        update_cache: true
      become: true

    - name: Install eza package
      ansible.builtin.apt:
        name: eza
        state: present
        cache_valid_time: 3600
      become: true

    - name: Clean up temporary GPG file
      ansible.builtin.file:
        path: /tmp/eza.asc
        state: absent

  rescue:
    - name: Display error message if installation fails
      ansible.builtin.debug:
        msg: "Failed to install eza. Please check network connectivity and repository availability."

    - name: Clean up on failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/eza.asc
        - /etc/apt/keyrings/gierens.gpg
        - /etc/apt/sources.list.d/gierens.list
      become: true
      ignore_errors: true