---
# https://github.com/containerd/containerd/blob/main/docs/getting-started.md
# https://github.com/containerd/containerd/blob/main/docs/man/containerd-config.toml.5.md
# https://github.com/containerd/containerd/blob/main/docs/managed-opt.md
# todo: At the next installation, verify how much of it is needed. These might be old.

# todo: Check this, is this still required? Looks like not.
- name: Check SystemdCgroup is already true
  ansible.builtin.command:
    cmd: grep -E '^SystemdCgroup\s*=\s*true' /etc/containerd/config.toml
  register: check_systemd_cgroup
  failed_when: false
  changed_when: false
  become: true

- name: Check cri is not in disabled_plugins
  ansible.builtin.command:
    cmd: grep -E '"cri"' /etc/containerd/config.toml
  register: check_cri_disabled
  failed_when: false
  changed_when: false
  become: true

- name: Apply containerd config fixes
  when: check_systemd_cgroup.rc != 0 or check_cri_disabled.rc == 0
  become: true
  block:
  - name: Ensure /etc/containerd directory exists
    ansible.builtin.file:
      path: /etc/containerd
      state: directory
      mode: '0755'
      owner: root
    become: true

  - name: Start with a full configuration of containerd
    ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
    changed_when: true

  - name: Get config.toml files previous setting
    ansible.builtin.import_tasks: ../generic-tasks/fetch-file.yml
    vars:
      file_path_and_name: /etc/containerd/config.toml
      new_file_path_and_name: "/etc/containerd/config-{{ ansible_hostname }}-default.toml"

  - name: Ensure SystemdCgroup is set to true in containerd config
    ansible.builtin.lineinfile:
      path: /etc/containerd/config.toml
      regexp: '^SystemdCgroup\\s*=\\s*(false|true)'
      line: 'SystemdCgroup = true'
      insertafter: '[plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]'
    become: true

  - name: Ensure disabled_plugins does not have cri in it.
    ansible.builtin.replace:
      path: /etc/containerd/config.toml
      regexp: '([\"]cri[\"][,]?)'
      replace: ''
      after: 'disabled_plugins ='
      before: ']'
    become: true

  - name: Get config.toml files edited state so we can compare if something goes awry
    ansible.builtin.import_tasks: ../generic-tasks/fetch-file.yml
    vars:
      file_path_and_name: /etc/containerd/config.toml
      new_file_path_and_name: /etc/containerd/config-edited.toml
    become: true
  
  - name: Restart the containerd service
    ansible.builtin.systemd:
      name: containerd
      state: restarted
    become: true
