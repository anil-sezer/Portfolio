## Prometheus server ConfigMap entries for rule files (allow prometheus labels interpolation)
ruleFiles: {}

## Prometheus server ConfigMap entries for scrape_config_files
## (allows scrape configs defined in additional files)
##
scrapeConfigFiles: []

## Prometheus server ConfigMap entries
##
serverFiles:
  ## Alerts configuration
  ## Ref: https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/
  alerting_rules.yml:
    groups:
      - name: cluster-nodes-hardware
        rules:
          - alert: NodeDown
            expr: up{job="kubernetes-nodes"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.instance }} is down"
              description: "Kubernetes node {{ $labels.instance }} has been unreachable for more than 2 minutes."

          - alert: KubeNodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} is not ready"
              description: "Kubernetes node {{ $labels.node }} condition 'Ready' has been false or unknown for more than 5 minutes."

          - alert: HostHighMemoryUsage
            expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100) < 15
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage on {{ $labels.node }}"
              description: "Node {{ $labels.node }} available memory is below 15% (current: {{ $value | printf \"%.1f\" }}%)."

          - alert: HostHighCpuLoad
            expr: 100 - (avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High CPU load on {{ $labels.node }}"
              description: "Node {{ $labels.node }} CPU usage has exceeded 85% for more than 10 minutes (current: {{ $value | printf \"%.1f\" }}%)."

          - alert: HostDiskSpaceLow
            expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs"} * 100) < 15
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Low disk space on {{ $labels.node }} ({{ $labels.mountpoint }})"
              description: "Filesystem on node {{ $labels.node }} at {{ $labels.mountpoint }} has less than 15% free space remaining (current: {{ $value | printf \"%.1f\" }}%)."

          - alert: RaspberryPiHighTemp
            expr: node_hwmon_temp_celsius > 75
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Raspberry Pi high temperature on {{ $labels.node }}"
              description: "Thermal sensor ({{ $labels.chip }} / {{ $labels.sensor }}) on node {{ $labels.node }} is above 75°C for more than 5 minutes (current: {{ $value | printf \"%.1f\" }}°C)."

      - name: kubernetes-workloads
        rules:
          - alert: KubePodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"
              description: "Pod {{ $labels.pod }} container {{ $labels.container }} in namespace {{ $labels.namespace }} restarted in the last 15 minutes."

          - alert: KubePodNotReady
            expr: kube_pod_status_ready{condition="true"} == 0 and on (namespace, pod) kube_pod_status_phase{phase=~"Running|Pending"} == 1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} is not ready"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in a non-ready or pending state for more than 10 minutes."

          - alert: KubeDeploymentReplicasMismatch
            expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Deployment {{ $labels.deployment }} replica mismatch"
              description: "Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} has {{ $value }} desired replicas mismatching available replicas for more than 10 minutes."

      - name: cronjobs-backups
        rules:
          - alert: KubeCronJobFailed
            expr: kube_job_status_failed{job_name=~"(postgres-backup|ip-lookup-go|get-daily-images).*"} > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "CronJob {{ $labels.job_name }} failed"
              description: "CronJob execution {{ $labels.job_name }} in namespace {{ $labels.namespace }} has failed."
  ## DEPRECATED DEFAULT VALUE, unless explicitly naming your files, please use alerting_rules.yml
  alerts: {}

  ## Records configuration
  ## Ref: https://prometheus.io/docs/prometheus/latest/configuration/recording_rules/
  recording_rules.yml: {}
  ## DEPRECATED DEFAULT VALUE, unless explicitly naming your files, please use recording_rules.yml
  rules: {}

  prometheus.yml:
    rule_files:
      - /etc/config/recording_rules.yml
      - /etc/config/alerting_rules.yml
      ## Below two files are DEPRECATED will be removed from this default values file
      - /etc/config/rules
      - /etc/config/alerts

# Adds option to add alert_relabel_configs to avoid duplicate alerts in alertmanager
# useful in H/A prometheus with different external labels but the same alerts
alertRelabelConfigs: {}
