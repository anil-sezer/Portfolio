---
name: ci-yaml-lint

on:
  push:
    branches:
      - "prod"
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - ".yamllint"
      - ".github/workflows/ci-yaml-lint.yml"
  pull_request:
    branches:
      - "prod"
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - ".yamllint"
      - ".github/workflows/ci-yaml-lint.yml"
  workflow_dispatch:

concurrency:
  group: ci-yaml-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - name: Check out codebase
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint .
