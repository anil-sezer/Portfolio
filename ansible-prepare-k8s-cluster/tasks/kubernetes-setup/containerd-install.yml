---
# =============================================================================
# Ansible Tasks: Install containerd (Option 1 – Official Binaries)
# Target OS  : Ubuntu Server (latest, arm64)
# Components : containerd + systemd service, runc, CNI plugins
#
# Update the version variables below when new releases are available:
#   containerd : https://github.com/containerd/containerd/releases
#   runc       : https://github.com/opencontainers/runc/releases
#   cni_plugins: https://github.com/containernetworking/plugins/releases
# =============================================================================

# -----------------------------------------------------------------------------
# Prep
# -----------------------------------------------------------------------------

- name: Remove Docker if its present
  ansible.builtin.apt:
    pkg:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent
  become: true

- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl
      - tar
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# -----------------------------------------------------------------------------
# Version Checks
# -----------------------------------------------------------------------------

- name: Check installed containerd version
  ansible.builtin.command: /usr/local/bin/containerd --version
  register: containerd_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Check installed runc version
  ansible.builtin.command: /usr/local/sbin/runc --version
  register: runc_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Check installed CNI plugins version
  ansible.builtin.command: /opt/cni/bin/bridge
  environment:
    CNI_COMMAND: ""
  register: cni_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Determine which container runtime components need installation or upgrade
  ansible.builtin.set_fact:
    containerd_needs_install: "{{ containerd_check.rc != 0 or (containerd_check.stdout | default('')) is not search('(^|\\s)v' ~ (containerd_version | regex_escape) ~ '(\\s|$)') }}"
    runc_needs_install: "{{ runc_check.rc != 0 or (runc_check.stdout | default('')) is not search('runc version ' ~ (runc_version | regex_escape) ~ '(\\s|$)') }}"
    cni_needs_install: "{{ cni_check.rc != 0 or (cni_check.stderr | default('')) is not search('(^|\\s)v' ~ (cni_version | regex_escape) ~ '(\\s|$)') }}"

# -----------------------------------------------------------------------------
# Download & Install (only when needed)
# -----------------------------------------------------------------------------

- name: Install or upgrade container runtime components
  when: (containerd_needs_install | bool) or (runc_needs_install | bool) or (cni_needs_install | bool)
  block:
    - name: Create temporary download directory
      ansible.builtin.file:
        path: "{{ tmp_dir_containerd }}"
        state: directory
        mode: "0755"
      become: true
      changed_when: false

    # -------------------------------------------------------------------------
    # Step 1 – containerd
    # -------------------------------------------------------------------------

    - name: Download containerd archive
      ansible.builtin.get_url:
        url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-{{ arch }}.tar.gz"
        dest: "{{ tmp_dir_containerd }}/containerd-{{ containerd_version }}-linux-{{ arch }}.tar.gz"
        checksum: "sha256:https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-{{ arch }}.tar.gz.sha256sum"
        mode: "0644"
      become: true
      when: containerd_needs_install | bool

    - name: Check if containerd service is currently active
      ansible.builtin.command: systemctl is-active containerd
      register: containerd_active
      failed_when: false
      changed_when: false
      check_mode: false
      when: containerd_needs_install | bool

    - name: Stop containerd before upgrade
      ansible.builtin.systemd:
        name: containerd
        state: stopped
      become: true
      when:
        - containerd_needs_install | bool
        - containerd_active.rc == 0

    - name: Extract containerd binaries to /usr/local
      ansible.builtin.unarchive:
        src: "{{ tmp_dir_containerd }}/containerd-{{ containerd_version }}-linux-{{ arch }}.tar.gz"
        dest: /usr/local
        remote_src: true
      become: true
      when: containerd_needs_install | bool

    - name: Create systemd directory for containerd service
      ansible.builtin.file:
        path: /usr/local/lib/systemd/system
        state: directory
        mode: "0755"
      become: true
      when: containerd_needs_install | bool

    - name: Download containerd systemd service file
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/containerd/containerd/main/containerd.service"
        dest: /usr/local/lib/systemd/system/containerd.service
        mode: "0644"
        force: true
      become: true
      when: containerd_needs_install | bool

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      when: containerd_needs_install | bool

    # -------------------------------------------------------------------------
    # Step 2 – runc
    # -------------------------------------------------------------------------

    - name: Download runc binary
      ansible.builtin.get_url:
        url: "https://github.com/opencontainers/runc/releases/download/v{{ runc_version }}/runc.{{ arch }}"
        dest: "{{ tmp_dir_containerd }}/runc.{{ arch }}"
        checksum: "sha256:https://github.com/opencontainers/runc/releases/download/v{{ runc_version }}/runc.sha256sum"
        mode: "0755"
      become: true
      when: runc_needs_install | bool

    - name: Install runc to /usr/local/sbin
      ansible.builtin.copy:
        src: "{{ tmp_dir_containerd }}/runc.{{ arch }}"
        dest: /usr/local/sbin/runc
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      become: true
      when: runc_needs_install | bool

    # -------------------------------------------------------------------------
    # Step 3 – CNI plugins
    # -------------------------------------------------------------------------

    - name: Create CNI bin directory
      ansible.builtin.file:
        path: /opt/cni/bin
        state: directory
        mode: "0755"
      become: true
      when: cni_needs_install | bool

    - name: Download CNI plugins archive
      ansible.builtin.get_url:
        url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_version }}/cni-plugins-linux-{{ arch }}-v{{ cni_version }}.tgz"
        dest: "{{ tmp_dir_containerd }}/cni-plugins-linux-{{ arch }}-v{{ cni_version }}.tgz"
        checksum: "sha256:https://github.com/containernetworking/plugins/releases/download/v{{ cni_version }}/cni-plugins-linux-{{ arch }}-v{{ cni_version }}.tgz.sha256"
        mode: "0644"
      become: true
      when: cni_needs_install | bool

    - name: Extract CNI plugins to /opt/cni/bin
      ansible.builtin.unarchive:
        src: "{{ tmp_dir_containerd }}/cni-plugins-linux-{{ arch }}-v{{ cni_version }}.tgz"
        dest: /opt/cni/bin
        remote_src: true
      become: true
      when: cni_needs_install | bool

  always:
    - name: Remove temporary download directory
      ansible.builtin.file:
        path: "{{ tmp_dir_containerd }}"
        state: absent
      become: true
      changed_when: false

- name: Enable and start containerd service
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
  become: true
