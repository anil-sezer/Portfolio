---
- name: Install and hold kubeadm, kubectl, and kubelet
  become: true
  block:
    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download and convert the Kubernetes apt keyring
      ansible.builtin.shell: >
        curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key |
        gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Configure Kubernetes apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        mode: "0644"
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /
      register: k8s_apt_repo

    - name: Install kubelet, kubeadm, and kubectl
      ansible.builtin.apt:
        update_cache: "{{ k8s_apt_repo.changed }}"
        state: present
        pkg:
          - kubelet
          - kubeadm
          - kubectl
        install_recommends: true

    - name: Prevent kubelet, kubeadm, and kubectl from being upgraded
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Prevent kernel and firmware packages from being upgraded
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - linux-image-raspi
        - linux-headers-raspi
        - linux-raspi
        - linux-firmware-raspi
        - flash-kernel
        - flash-kernel-piboot
      failed_when: false
