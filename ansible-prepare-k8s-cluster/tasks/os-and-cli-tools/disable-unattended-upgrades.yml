---
- name: Disable automatic unattended upgrades and hold kernel/firmware packages
  become: true
  block:
    - name: Disable periodic unattended upgrades in /etc/apt/apt.conf.d/20auto-upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "0";

    - name: Blacklist kernel and firmware packages in /etc/apt/apt.conf.d/52k8s-unattended-blacklist.conf
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52k8s-unattended-blacklist.conf
        mode: "0644"
        content: |
          Unattended-Upgrade::Package-Blacklist {
              "linux-";
              "raspi-firmware";
              "raspberrypi-";
              "rpi-eeprom";
          };

    - name: Stop and disable unattended-upgrades service
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
        enabled: false
      failed_when: false

    - name: Prevent kernel and firmware metapackages from being upgraded
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - raspi-firmware
        - raspberrypi-bootloader
        - raspberrypi-sys-mods
        - rpi-eeprom
        - linux-image-rpi-v8
        - linux-headers-rpi-v8
        - linux-image-rpi-2712
        - linux-headers-rpi-2712
      failed_when: false

    - name: Prevent currently installed kernel images, headers, and firmware from being upgraded
      ansible.builtin.shell: |
        pkgs=$(dpkg -l | awk '$1 == "ii" && $2 ~ /^(linux-image|linux-modules|linux-headers|raspi-firmware|raspberrypi-bootloader|raspberrypi-sys-mods|rpi-eeprom)/ {print $2}')
        if [ -n "$pkgs" ]; then
          apt-mark hold $pkgs
        fi
      register: apt_mark_hold
      changed_when: apt_mark_hold.stdout | length > 0
