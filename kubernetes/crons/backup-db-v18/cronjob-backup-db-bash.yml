---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: portfolio
spec:
  schedule: "0 1 * * 0"  # Runs every Sunday at 01:00
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: regcred
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: wait-for-netpol
              image: busybox:1.37
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "sleep 3"]
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
          containers:
            - name: postgres-backup
              image: imgregistry.anil-sezer.com/pg_dump:v18
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: RETAIN_COUNT
                  value: "4" # Keep this number of backups

                - name: SQL_DB_NAME
                  value: "portfolio"

                - name: ENV_NAME
                  value: "Portfolio-PROD"

                - name: SQL_DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: portfolio-secrets
                      key: SQL_DB_HOST
    
                - name: SQL_DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: portfolio-secrets
                      key: SQL_DB_PORT
    
                - name: SQL_DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: portfolio-secrets
                      key: SQL_DB_USER
    
                - name: SQL_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: portfolio-secrets
                      key: SQL_DB_PASSWORD

                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: portfolio-secrets
                      key: NOTIFICATION_TELEGRAM_API_KEY

                - name: TELEGRAM_CHAT_ID
                  valueFrom:
                    secretKeyRef:
                      name: portfolio-secrets
                      key: NOTIFICATION_TELEGRAM_CHAT_ID

              volumeMounts:
                - name: db-backup-portfolio-nfs
                  mountPath: /backups
                  readOnly: false
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: db-backup-portfolio-nfs
              persistentVolumeClaim:
                claimName: db-backup-portfolio-nfs
