---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: seq-nfs
spec:
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  mountOptions:
    - nfsvers=4.2
    - wsize=131072
    - rsize=131072
    - hard
  nfs:
    server: 192.168.1.119
    path: /mnt/nas/ssd/k8s/observability/seq
