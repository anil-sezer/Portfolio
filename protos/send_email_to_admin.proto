syntax = "proto3";

option csharp_namespace = "Portfolio.Grpc";

package client_info;

import "google/protobuf/empty.proto";

service SendEmailToAdmin {
  rpc Send (SendRequest) returns (google.protobuf.Empty);
}

message SendRequest {
  string sender_name = 1;
  string sender_email = 2;
  string subject = 3;
  string message = 4;
}
