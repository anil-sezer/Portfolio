---
# ==============================================================================
# CIS Kubernetes Benchmark Control Plane Hardening
#
# Idempotently applies CIS remediation tasks on the control plane node:
#   - CIS 1.2.5 / 1.2.30:
#     1. Ensures --kubelet-certificate-authority=/etc/kubernetes/pki/ca.crt and
#        --service-account-extend-token-expiration=false are set in
#        /etc/kubernetes/manifests/kube-apiserver.yaml.
#     (Note: Kubelet serverTLSBootstrap and CSR approval are handled in kubelet-config.yml)
#   - CIS 1.2.15 / 1.3.2 / 1.4.1:
#     1. Ensures --profiling=false is set in kube-apiserver.yaml,
#        kube-controller-manager.yaml, and kube-scheduler.yaml.
#   - CIS 1.2.16 / 1.2.17 / 1.2.18 / 1.2.19:
#     1. Ensures /var/log/kubernetes/audit (0700) and /etc/kubernetes/audit-policy.yaml (0600)
#        exist on the control plane node.
#     2. Ensures audit logging flags and hostPath mounts are configured in
#        /etc/kubernetes/manifests/kube-apiserver.yaml.
#   - CIS 1.2.20 / 1.2.29 (Not needed in a homelab but why not):
#     1. Ensures --request-timeout=300s and strong AEAD --tls-cipher-suites are set
#        in /etc/kubernetes/manifests/kube-apiserver.yaml.
#   - CIS 1.2.3 / 1.2.9:
#     1. Ensures /etc/kubernetes/admission-control (0700) with admission-config.yaml
#        and event-rate-limit-config.yaml (0600) exist on the control plane node.
#     2. Enables DenyServiceExternalIPs and EventRateLimit admission plugins
#        (alongside NodeRestriction) and configures --admission-control-config-file.
#   - CIS 1.1.12:
#     1. Ensures system group and user `etcd` exist on the control plane node.
#     2. Ensures /var/lib/etcd has etcd:etcd ownership and 0700 permissions.
# ==============================================================================

- name: Harden control plane static pod manifests (control plane only)
  when: inventory_hostname in groups['control_node']
  become: true
  block:
    - name: Ensure Kubernetes API audit log directory exists
      ansible.builtin.file:
        path: /var/log/kubernetes/audit
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Deploy Kubernetes API audit policy configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/audit-policy.yaml"
        dest: /etc/kubernetes/audit-policy.yaml
        owner: root
        group: root
        mode: "0600"

    - name: Ensure Kubernetes admission control config directory exists
      ansible.builtin.file:
        path: /etc/kubernetes/admission-control
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Deploy Kubernetes admission control configuration files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/admission-control/{{ item }}"
        dest: "/etc/kubernetes/admission-control/{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - admission-config.yaml
        - event-rate-limit-config.yaml

    - name: Define required CIS flags and mounts per control plane static pod manifest
      vars:
        cis_apiserver_tls_cipher_suites:
          - TLS_AES_128_GCM_SHA256
          - TLS_AES_256_GCM_SHA384
          - TLS_CHACHA20_POLY1305_SHA256
          - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
          - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
          - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
          - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
          - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
          - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
      ansible.builtin.set_fact:
        cis_manifests_to_update: []
        cis_control_plane_manifests:
          - path: /etc/kubernetes/manifests/kube-apiserver.yaml
            flags:
              - "--admission-control-config-file=/etc/kubernetes/admission-control/admission-config.yaml"
              - "--audit-log-maxage=30"
              - "--audit-log-maxbackup=10"
              - "--audit-log-maxsize=100"
              - "--audit-log-path=/var/log/kubernetes/audit/audit.log"
              - "--audit-policy-file=/etc/kubernetes/audit-policy.yaml"
              - "--enable-admission-plugins=NodeRestriction,DenyServiceExternalIPs,EventRateLimit"
              - "--kubelet-certificate-authority=/etc/kubernetes/pki/ca.crt"
              - "--profiling=false"
              - "--request-timeout=300s"
              - "--service-account-extend-token-expiration=false"
              - "--tls-cipher-suites={{ cis_apiserver_tls_cipher_suites | join(',') }}"
            volume_mounts:
              - mountPath: /etc/kubernetes/admission-control
                name: admission-control
                readOnly: true
              - mountPath: /etc/kubernetes/audit-policy.yaml
                name: audit-policy
                readOnly: true
              - mountPath: /var/log/kubernetes/audit
                name: audit-logs
            volumes:
              - hostPath:
                  path: /etc/kubernetes/admission-control
                  type: Directory
                name: admission-control
              - hostPath:
                  path: /etc/kubernetes/audit-policy.yaml
                  type: File
                name: audit-policy
              - hostPath:
                  path: /var/log/kubernetes/audit
                  type: DirectoryOrCreate
                name: audit-logs
          - path: /etc/kubernetes/manifests/kube-controller-manager.yaml
            flags:
              - "--profiling=false"
            volume_mounts: []
            volumes: []
          - path: /etc/kubernetes/manifests/kube-scheduler.yaml
            flags:
              - "--profiling=false"
            volume_mounts: []
            volumes: []

    - name: Read control plane static pod manifests
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ cis_control_plane_manifests }}"
      loop_control:
        label: "{{ item.path }}"
      register: cis_manifests_raw

    - name: Compute control plane manifests requiring CIS flag or mount updates
      ansible.builtin.set_fact:
        cis_manifests_to_update: >-
          {{ cis_manifests_to_update + [{
               'path': item.item.path,
               'name': item.item.path | basename,
               'updated_manifest': parsed_manifest | combine({
                 'spec': {
                   'containers': [
                     parsed_manifest.spec.containers[0] | combine({
                       'command': retained_cmd + missing_flags,
                       'volumeMounts': current_mounts + missing_mounts
                     })
                   ],
                   'volumes': current_volumes + missing_volumes
                 }
               }, recursive=True)
             }] }}
      vars:
        parsed_manifest: "{{ item.content | b64decode | from_yaml }}"
        current_cmd: "{{ parsed_manifest.spec.containers[0].command }}"
        missing_flags: "{{ item.item.flags | difference(current_cmd) }}"
        missing_flag_prefixes: "{{ missing_flags | map('regex_replace', '^(--[^=]+=).*$', '\\1') | list }}"
        retained_cmd: >-
          {{ current_cmd | reject('match', '^(' ~ (missing_flag_prefixes | map('regex_escape') | join('|')) ~ ')') | list
             if (missing_flags | length > 0) else current_cmd }}
        current_mounts: "{{ parsed_manifest.spec.containers[0].volumeMounts | default([]) }}"
        current_mount_names: "{{ current_mounts | map(attribute='name') | list }}"
        missing_mounts: "{{ item.item.volume_mounts | rejectattr('name', 'in', current_mount_names) | list }}"
        current_volumes: "{{ parsed_manifest.spec.volumes | default([]) }}"
        current_volume_names: "{{ current_volumes | map(attribute='name') | list }}"
        missing_volumes: "{{ item.item.volumes | rejectattr('name', 'in', current_volume_names) | list }}"
      loop: "{{ cis_manifests_raw.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: (missing_flags | length > 0) or (missing_mounts | length > 0) or (missing_volumes | length > 0)

    - name: Ensure external manifest backup directory exists
      ansible.builtin.file:
        path: /etc/kubernetes/manifests.bak
        state: directory
        mode: "0700"
      when: cis_manifests_to_update | length > 0

    - name: Back up control plane manifests before modification
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "/etc/kubernetes/manifests.bak/{{ item.name }}.{{ ansible_facts['date_time']['epoch'] }}"
        mode: "0600"
        remote_src: true
      loop: "{{ cis_manifests_to_update }}"
      loop_control:
        label: "{{ item.path }}"
      when: cis_manifests_to_update | length > 0

    - name: Write hardened control plane static pod manifests
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        content: "{{ item.updated_manifest | to_nice_yaml(indent=2) }}"
        mode: "0600"
      loop: "{{ cis_manifests_to_update }}"
      loop_control:
        label: "{{ item.path }}"
      when: cis_manifests_to_update | length > 0

- name: Resolve etcd data directory ownership on control plane (CIS 1.1.12)
  when: inventory_hostname in groups['control_node']
  become: true
  block:
    - name: Ensure etcd system group exists
      ansible.builtin.group:
        name: etcd
        system: true
        state: present

    - name: Ensure etcd system user exists
      ansible.builtin.user:
        name: etcd
        group: etcd
        home: /var/lib/etcd
        create_home: false
        shell: /usr/sbin/nologin
        comment: "etcd service user"
        system: true
        state: present

    - name: Ensure etcd data directory exists with etcd:etcd ownership and 0700 mode
      ansible.builtin.file:
        path: /var/lib/etcd
        state: directory
        owner: etcd
        group: etcd
        mode: "0700"
      register: cis_etcd_data_dir

    - name: Recursively align existing etcd data files on initial ownership setup
      ansible.builtin.command: chown -R etcd:etcd /var/lib/etcd
      changed_when: true
      when: cis_etcd_data_dir.changed
