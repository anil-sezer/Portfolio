---
- name: Ensure IP forwarding is enabled in /etc/sysctl.d/k8s.conf
  ansible.builtin.lineinfile:
    path: /etc/sysctl.d/k8s.conf
    regexp: '^net\.ipv4\.ip_forward\s*='
    line: "net.ipv4.ip_forward = 1"
    create: true
    mode: "0644"
    owner: root
    group: root
  become: true
  notify: reload sysctl

- name: Check runtime IP forwarding state
  ansible.builtin.command: sysctl -n net.ipv4.ip_forward
  register: ip_forward_status
  changed_when: ip_forward_status.stdout | trim != '1'
  check_mode: false
  notify: reload sysctl

- name: Flush handlers to ensure IP forwarding is active before kubeadm preflight
  ansible.builtin.meta: flush_handlers
