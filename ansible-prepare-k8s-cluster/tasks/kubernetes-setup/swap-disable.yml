---
- name: Check if swap is enabled
  ansible.builtin.command: swapon --show
  register: swap_status
  changed_when: false
  check_mode: false

- name: Disable swap in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n]*[ \t]+swap[ \t]+.*)$'
    replace: '#\1'
  become: true

- name: Disable active swap and reboot
  when: swap_status.stdout | trim | length > 0
  block:
    - name: Disable swap for this session
      ansible.builtin.command: swapoff -a
      changed_when: true
      become: true

    - name: Reboot device
      ansible.builtin.reboot:
        reboot_timeout: 3600
        msg: Rebooting machine in 3600 as timeout
      become: true
