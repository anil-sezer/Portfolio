---
- name: Tune Raspberry Pi eth0 to prevent EEE flaps, macb deadlocks, and deploy network watchdog
  become: true
  when: inventory_hostname in groups['k8s_nodes']
  block:
    - name: Ensure ethtool is installed
      ansible.builtin.apt:
        name: ethtool
        state: present

    - name: Disable Energy-Efficient Ethernet (dtparam=eee=off) in /boot/firmware/config.txt
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        insertafter: '^dtparam=watchdog=on'
        regexp: '^dtparam=eee='
        line: 'dtparam=eee=off'

    - name: Disable ASPM L0s on external PCIe link (dtparam=pciex1_no_l0s=on) on Pi 5 nodes
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        insertafter: '^dtparam=eee=off'
        regexp: '^dtparam=pciex1_no_l0s='
        line: 'dtparam=pciex1_no_l0s=on'
      when: "'rpi5' in inventory_hostname"

    - name: Append pcie_aspm=off to /boot/firmware/current/cmdline.txt and /boot/firmware/cmdline.txt on Pi 5 nodes
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^((?!.*\bpcie_aspm=off\b).*[^\s])\s*$'
        replace: '\1 pcie_aspm=off'
      loop:
        - /boot/firmware/current/cmdline.txt
        - /boot/firmware/cmdline.txt
      when: "'rpi5' in inventory_hostname"

    - name: Deploy eth0-tuning.service on Pi 4 nodes
      ansible.builtin.copy:
        dest: /etc/systemd/system/eth0-tuning.service
        mode: "0644"
        owner: root
        group: root
        content: |
          [Unit]
          Description=Disable EEE on Pi 4 eth0 (bcmgenet)
          After=sys-subsystem-net-devices-eth0.device systemd-networkd.service network.target
          Wants=sys-subsystem-net-devices-eth0.device

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/sh -c '/usr/sbin/ethtool --set-eee eth0 eee off || true'

          [Install]
          WantedBy=multi-user.target
      when: "'rpi4' in inventory_hostname"
      register: pi4_eth0_unit

    - name: Deploy eth0-tuning.service on Pi 5 nodes
      ansible.builtin.copy:
        dest: /etc/systemd/system/eth0-tuning.service
        mode: "0644"
        owner: root
        group: root
        content: |
          [Unit]
          Description=Tune Pi 5 eth0 (macb) - Disable EEE/TSO and increase RX/TX ring buffers
          After=sys-subsystem-net-devices-eth0.device systemd-networkd.service network.target
          Wants=sys-subsystem-net-devices-eth0.device

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/sh -c '/usr/sbin/ethtool --set-eee eth0 eee off || true'
          ExecStart=/usr/sbin/ethtool -G eth0 rx 2048 tx 2048
          ExecStart=/usr/sbin/ethtool -K eth0 tso off

          [Install]
          WantedBy=multi-user.target
      when: "'rpi5' in inventory_hostname"
      register: pi5_eth0_unit

    - name: Enable and start eth0-tuning.service
      ansible.builtin.systemd:
        name: eth0-tuning.service
        daemon_reload: true
        enabled: true
        state: started

    # -------------------------------------------------------------
    # Network Watchdog: auto-reboots node if eth0 locks up
    # -------------------------------------------------------------
    - name: Deploy network watchdog script
      ansible.builtin.copy:
        dest: /usr/local/bin/network-watchdog.sh
        mode: "0755"
        owner: root
        group: root
        content: |
          #!/bin/bash
          set -euo pipefail

          MAX_FAILURES=3
          STATE_FILE="/run/network-watchdog-failures"

          # Target hosts on local network to verify eth0 connectivity
          TARGETS=("192.168.1.1" "192.168.1.120" "192.168.1.119" "192.168.1.121")

          LOCAL_IP=$(ip -4 -o addr show dev eth0 2>/dev/null | grep -oP "inet \K[\d.]+" || true)

          ONLINE=0
          for target in "${TARGETS[@]}"; do
            if [ -n "$LOCAL_IP" ] && [ "$target" = "$LOCAL_IP" ]; then
              continue
            fi
            if ping -c 1 -W 2 -I eth0 "$target" >/dev/null 2>&1; then
              ONLINE=1
              break
            fi
          done

          if [ "$ONLINE" -eq 1 ]; then
            if [ -f "$STATE_FILE" ]; then
              PREV_FAILS=$(cat "$STATE_FILE" 2>/dev/null || echo 0)
              rm -f "$STATE_FILE"
              logger -t network-watchdog -p daemon.info "Network recovered after $PREV_FAILS failure(s)."
            fi
            exit 0
          fi

          FAILS=0
          if [ -f "$STATE_FILE" ]; then
            FAILS=$(cat "$STATE_FILE" 2>/dev/null || echo 0)
          fi
          FAILS=$((FAILS + 1))
          echo "$FAILS" > "$STATE_FILE"

          logger -t network-watchdog -p daemon.warn "Network check failed ($FAILS/$MAX_FAILURES): all LAN targets unreachable on eth0."

          if [ "$FAILS" -lt "$MAX_FAILURES" ]; then
            logger -t network-watchdog -p daemon.notice "Attempting eth0 link reset..."
            ip link set eth0 down || true
            sleep 2
            ip link set eth0 up || true
          else
            logger -t network-watchdog -p daemon.crit "Network unreachable for $FAILS consecutive checks. Force rebooting node!"
            sync
            systemctl reboot || reboot -f
          fi

    - name: Deploy network watchdog systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/network-watchdog.service
        mode: "0644"
        owner: root
        group: root
        content: |
          [Unit]
          Description=Raspberry Pi eth0 Network Watchdog
          After=network.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/network-watchdog.sh

    - name: Deploy network watchdog systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/network-watchdog.timer
        mode: "0644"
        owner: root
        group: root
        content: |
          [Unit]
          Description=Run Raspberry Pi eth0 Network Watchdog every 60s
          After=network.target

          [Timer]
          OnBootSec=3min
          OnUnitActiveSec=60s
          AccuracySec=5s

          [Install]
          WantedBy=timers.target

    - name: Enable and start network-watchdog.timer
      ansible.builtin.systemd:
        name: network-watchdog.timer
        daemon_reload: true
        enabled: true
        state: started
