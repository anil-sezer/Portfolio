---
# ==============================================================================
# MetalLB Setup (Native Mode)
#
# Configures kube-proxy for IPVS strictARP mode, installs MetalLB native manifests
# (L2/native mode without unused FRR-K8s BGP daemons), waits for controller/speaker
# rollouts, and applies the IPAddressPool and L2Advertisement configuration from
# the repository.
# ==============================================================================

- name: Retrieve current kube-proxy ConfigMap from kube-system
  ansible.builtin.command: kubectl get configmap kube-proxy -n kube-system -o json
  register: kube_proxy_cm_raw
  changed_when: false
  become: false

- name: Parse kube-proxy ConfigMap JSON and config.conf
  ansible.builtin.set_fact:
    kube_proxy_cm_json: "{{ kube_proxy_cm_raw.stdout | from_json }}"
    kube_proxy_current_config: "{{ (kube_proxy_cm_raw.stdout | from_json).data['config.conf'] | from_yaml }}"

- name: Merge strictARP and ipvs mode into kube-proxy configuration
  ansible.builtin.set_fact:
    kube_proxy_desired_config: >-
      {{ kube_proxy_current_config
         | combine({
             'ipvs': {'strictARP': true},
             'mode': 'ipvs'
           }, recursive=True) }}

- name: Check if kube-proxy ConfigMap requires update
  ansible.builtin.set_fact:
    kube_proxy_cm_needs_update: >-
      {{ (kube_proxy_current_config.get('ipvs') or {}).get('strictARP') != true or
         kube_proxy_current_config.get('mode') != 'ipvs' }}

- name: Prepare kube-proxy ConfigMap manifest for declarative apply
  ansible.builtin.set_fact:
    kube_proxy_cm_manifest:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kube-proxy
        namespace: kube-system
      data: "{{ kube_proxy_cm_json.data | combine({'config.conf': kube_proxy_desired_config | to_nice_yaml(indent=2)}) }}"
  when: kube_proxy_cm_needs_update | bool

- name: Apply updated kube-proxy ConfigMap to kube-system
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ kube_proxy_cm_manifest | to_nice_yaml(indent=2) }}"
  register: kube_proxy_cm_apply
  changed_when: "'configured' in kube_proxy_cm_apply.stdout or 'created' in kube_proxy_cm_apply.stdout"
  become: false
  when: kube_proxy_cm_needs_update | bool

- name: Install MetalLB (Native mode)
  ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.16.1/config/manifests/metallb-native.yaml
  register: metallb_install_result
  changed_when: "'configured' in metallb_install_result.stdout or 'created' in metallb_install_result.stdout"
  become: false

- name: Wait for MetalLB controller deployment to be ready
  ansible.builtin.command: kubectl rollout status deployment/controller -n metallb-system --timeout=120s
  changed_when: false
  become: false

- name: Wait for MetalLB speaker daemonset to be ready
  ansible.builtin.command: kubectl rollout status daemonset/speaker -n metallb-system --timeout=120s
  changed_when: false
  become: false

- name: Apply MetalLB IPAddressPool and L2Advertisement configuration
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../kubernetes/metallb-config.yml') }}"
  register: metallb_config_apply_result
  changed_when: "'configured' in metallb_config_apply_result.stdout or 'created' in metallb_config_apply_result.stdout"
  become: false

- name: Print MetalLB config apply result
  ansible.builtin.debug:
    var: metallb_config_apply_result.stdout_lines
  when: metallb_config_apply_result.changed
