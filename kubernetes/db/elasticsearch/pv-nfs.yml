---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: elasticsearch-nfs
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.2
    - wsize=131072
    - rsize=131072
    - hard
  nfs:
    server: 192.168.1.119
    path: /mnt/nas/ssd/k8s/database/elasticsearch
  storageClassName: elasticsearch-nfs