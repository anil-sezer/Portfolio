---
name: ci-security

on:
  push:
    branches:
      - "prod"
    paths:
      - "src/**"
      - "tests/**"
      - "protos/**"
      - "kubernetes/**"
      - "ansible-prepare-k8s-cluster/**"
      - "global.json"
      - "Directory.Packages.props"
      - "Portfolio.sln"
      - ".github/workflows/ci-security.yml"
  pull_request:
    branches:
      - "prod"
    paths:
      - "src/**"
      - "tests/**"
      - "protos/**"
      - "kubernetes/**"
      - "ansible-prepare-k8s-cluster/**"
      - "global.json"
      - "Directory.Packages.props"
      - "Portfolio.sln"
      - ".github/workflows/ci-security.yml"
  schedule:
    # Run audit weekly at 04:00 UTC on Mondays
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet-audit:
    name: Audit .NET Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out codebase
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Portfolio.sln

      - name: Check for vulnerable packages
        run: dotnet list Portfolio.sln package --vulnerable --include-transitive

  go-audit:
    name: Audit Go Dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - kubernetes/crons/ip-lookup-cron
          - kubernetes/crons/get-image-of-the-day-from-bing
    steps:
      - name: Check out codebase
        uses: actions/checkout@v4

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: ${{ matrix.module }}
          go-version-input: "1.26.x"
          cache: false

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out codebase
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"
          format: "table"

      - name: Run Trivy configuration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          format: "table"
