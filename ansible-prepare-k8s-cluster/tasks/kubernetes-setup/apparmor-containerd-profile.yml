---
# Fixes AppArmor 5.0 / Ubuntu 26.04 LTS stacked profile signal denial bug:
# In Ubuntu 26.04 (Kernel 7.0), unprivileged user namespace stacking produces
# 'cri-containerd.apparmor.d//&unconfined'. Containerd's default profile rule
# 'signal (receive) peer=@{profile_name}' fails strict peer matching, blocking
# intra-container signals (SIGRTMIN+2 for .NET CoreCLR GC, SIGABRT, SIGHUP for MetalLB FRR).
# This custom profile preserves all security/filesystem/mount restrictions while allowing signals.

- name: Configure containerd AppArmor profile with signal support
  become: true
  block:
    - name: Ensure /etc/apparmor.d directory exists
      ansible.builtin.file:
        path: /etc/apparmor.d
        state: directory
        mode: "0755"

    - name: Deploy cri-containerd AppArmor profile with signal permissions
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/cri-containerd.apparmor.d"
        dest: /etc/apparmor.d/cri-containerd.apparmor.d
        mode: "0644"
        owner: root
        group: root
      register: apparmor_profile

    - name: Reload cri-containerd AppArmor profile live
      ansible.builtin.command:
        cmd: apparmor_parser -r /etc/apparmor.d/cri-containerd.apparmor.d
      when: apparmor_profile.changed
      changed_when: true
