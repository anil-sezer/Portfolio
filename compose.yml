---
name: portfolio

services:
  grpc:
    build:
      context: .
      dockerfile: Portfolio.Grpc/Dockerfile
    restart: unless-stopped
    container_name: grpc
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8081
      SQL_DB_HOST: db_postgres
      SQL_DB_PORT: 5432
      SQL_DB_USER: ${SQL_DB_USER}
      SQL_DB_NAME: ${SQL_DB_NAME}
      SQL_DB_PASSWORD: ${SQL_DB_PASSWORD}
      OTEL_COLLECTOR_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT}
      NOTIFICATION_TELEGRAM_API_KEY: ${NOTIFICATION_TELEGRAM_API_KEY}
      NOTIFICATION_TELEGRAM_CHAT_ID: ${NOTIFICATION_TELEGRAM_CHAT_ID}
    ports:
      - "8081:8081"
    depends_on:
      db_postgres:
        condition: service_healthy

  website:
    build:
      context: .
      dockerfile: Portfolio.Ui/Dockerfile
    restart: unless-stopped
    container_name: website
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8080
      GRPC_BASE_URL: "http://grpc:8081"
      OTEL_COLLECTOR_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT}
    ports:
      - "8080:8080"
    depends_on:
      grpc:
        condition: service_started

  db_postgres:
    image: postgres:18
    restart: unless-stopped
    container_name: db_postgres
    environment:
      POSTGRES_DB: ${SQL_DB_NAME}
      POSTGRES_USER: ${SQL_DB_USER}
      POSTGRES_PASSWORD: ${SQL_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_DB_USER} -d ${SQL_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 2s
      start_period: 10s

  adminneo:
    image: adminneoorg/adminneo:latest
    restart: unless-stopped
    container_name: adminneo
    environment:
      NEO_DEFAULT_SERVER: db_postgres
      NEO_DEFAULT_DRIVER: pgsql
    ports:
      - "8090:8080"
    depends_on:
      db_postgres:
        condition: service_healthy

volumes:
  postgres_data:
