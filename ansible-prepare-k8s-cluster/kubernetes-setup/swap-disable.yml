---
- name: Check if swap is enabled
  ansible.builtin.command: swapon --show
  register: swap_status
  changed_when: false

- name: Update /etc/hosts so It will be ready for Kubernetes.
  when: swap_status.stdout | length > 0
  block:
  - name: Disable swap for this session
    ansible.builtin.command: swapoff -a
    changed_when: true
  
  - name: Disable swap if it's enabled
    ansible.builtin.command: sudo sed -i '/ swap / s/^\\(.*\\)$/#\\1/g' /etc/fstab

  - name: Reboot device
    ansible.builtin.reboot:
      reboot_timeout: 3600
      msg: Rebooting machine in 3600 as timeout
    become: true
