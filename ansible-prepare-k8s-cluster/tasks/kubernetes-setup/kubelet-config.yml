---
# ==============================================================================
# Kubelet Configuration, Resource Reservations, and TLS Bootstrapping
#
# Configures kubelet serverTLSBootstrap, systemReserved, kubeReserved, and hard
# memory/disk eviction thresholds in /var/lib/kubelet/config.yaml across all
# cluster nodes.
# Synchronizes ConfigMap/kubelet-config in namespace kube-system on the control
# plane so future kubeadm upgrade cycles retain these settings.
# Approves any pending kubernetes.io/kubelet-serving CSRs.
# ==============================================================================

- name: Define desired kubelet configuration settings
  ansible.builtin.set_fact:
    kubelet_desired_config:
      serverTLSBootstrap: true
      systemReserved:
        cpu: "{{ kubelet_system_reserved_cpu | default('200m') }}"
        memory: "{{ kubelet_system_reserved_memory | default('512Mi') }}"
      kubeReserved:
        cpu: "{{ kubelet_kube_reserved_cpu | default('200m') }}"
        memory: "{{ kubelet_kube_reserved_memory | default('512Mi') }}"
      evictionHard:
        imagefs.available: "15%"
        imagefs.inodesFree: "5%"
        memory.available: "{{ kubelet_eviction_hard_memory | default('300Mi') }}"
        nodefs.available: "10%"
        nodefs.inodesFree: "5%"

- name: Configure node kubelet settings and restart service if changed
  become: true
  block:
    - name: Ensure /var/lib/kubelet directory exists
      ansible.builtin.file:
        path: /var/lib/kubelet
        state: directory
        mode: "0755"

    - name: Check if kubelet config.yaml exists
      ansible.builtin.stat:
        path: /var/lib/kubelet/config.yaml
      register: kubelet_config_stat

    - name: Read existing kubelet configuration
      ansible.builtin.slurp:
        src: /var/lib/kubelet/config.yaml
      register: kubelet_raw_config
      when: kubelet_config_stat.stat.exists

    - name: Merge desired settings into kubelet configuration
      ansible.builtin.set_fact:
        kubelet_updated_config: >-
          {{ (kubelet_raw_config.content | b64decode | from_yaml)
             | combine(kubelet_desired_config, recursive=True) }}
      when: kubelet_config_stat.stat.exists

    - name: Write updated kubelet config.yaml
      ansible.builtin.copy:
        dest: /var/lib/kubelet/config.yaml
        content: "{{ kubelet_updated_config | to_nice_yaml(indent=2) }}"
        mode: "0644"
        backup: true
      register: kubelet_config_file
      when: kubelet_config_stat.stat.exists

    - name: Restart kubelet if configuration changed
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
      when:
        - kubelet_config_stat.stat.exists
        - kubelet_config_file.changed

- name: Synchronize kubelet-config ConfigMap and approve serving CSRs (control plane only)
  when: inventory_hostname in groups['control_node']
  become: false
  block:
    - name: Retrieve current kubelet-config ConfigMap from kube-system
      ansible.builtin.command: kubectl get cm kubelet-config -n kube-system -o json
      register: kubelet_cm_raw
      changed_when: false

    - name: Parse kubelet-config ConfigMap JSON
      ansible.builtin.set_fact:
        kubelet_cm_json: "{{ kubelet_cm_raw.stdout | from_json }}"

    - name: Parse and merge desired settings into ConfigMap kubelet configuration
      ansible.builtin.set_fact:
        kubelet_cm_current_config: "{{ kubelet_cm_json.data.kubelet | from_yaml }}"
        kubelet_cm_desired_config: >-
          {{ (kubelet_cm_json.data.kubelet | from_yaml)
             | combine(kubelet_desired_config, recursive=True) }}

    - name: Check if ConfigMap kubelet configuration requires update
      ansible.builtin.set_fact:
        kubelet_cm_needs_update: "{{ kubelet_cm_current_config != kubelet_cm_desired_config }}"

    - name: Prepare ConfigMap manifest for declarative apply
      ansible.builtin.set_fact:
        kubelet_cm_manifest:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: kubelet-config
            namespace: kube-system
          data:
            kubelet: "{{ kubelet_cm_desired_config | to_nice_yaml(indent=2) }}"
      when: kubelet_cm_needs_update | bool

    - name: Apply updated kubelet-config ConfigMap to kube-system
      ansible.builtin.command: kubectl apply -f -
      args:
        stdin: "{{ kubelet_cm_manifest | to_nice_yaml(indent=2) }}"
      register: kubelet_cm_apply
      changed_when: "'configured' in kubelet_cm_apply.stdout or 'created' in kubelet_cm_apply.stdout"
      when: kubelet_cm_needs_update | bool

    - name: List pending kubernetes.io/kubelet-serving CSRs
      ansible.builtin.command: kubectl get csr -o json
      register: kubelet_csr_list_raw
      changed_when: false

    - name: Extract pending kubelet-serving CSR names
      ansible.builtin.set_fact:
        kubelet_pending_csrs: >-
          {{ (kubelet_csr_list_raw.stdout | from_json)['items']
             | selectattr('spec.signerName', 'equalto', 'kubernetes.io/kubelet-serving')
             | rejectattr('status.conditions', 'defined')
             | map(attribute='metadata.name')
             | list }}

    - name: Approve pending kubernetes.io/kubelet-serving CSRs
      ansible.builtin.command: "kubectl certificate approve {{ item }}"
      loop: "{{ kubelet_pending_csrs }}"
      when: kubelet_pending_csrs | length > 0
