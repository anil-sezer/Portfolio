---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: portfolio
  labels:
    app: github-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      serviceAccountName: github-runner-deployer
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      initContainers:
        - name: install-kubectl
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              cp $(which kubectl) /opt/bin/kubectl
              chmod 755 /opt/bin/kubectl
          volumeMounts:
            - name: kubectl-bin
              mountPath: /opt/bin
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e

              cleanup() {
                echo "Caught termination signal, cleaning up..."
                if [ -n "${GITHUB_PAT:-}" ]; then
                  echo "Requesting remove token from GitHub API..."
                  REMOVE_TOKEN_RESPONSE=$(curl -s -L -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${GITHUB_PAT}" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/anil-sezer/Portfolio/actions/runners/remove-token")
                  REMOVE_TOKEN=$(echo "${REMOVE_TOKEN_RESPONSE}" | jq -r '.token // empty')
                  if [ -n "${REMOVE_TOKEN}" ]; then
                    echo "Deregistering runner ${RUNNER_NAME}..."
                    ./config.sh remove --token "${REMOVE_TOKEN}" || true
                  fi
                fi
                exit 0
              }

              trap cleanup SIGTERM SIGINT

              REG_TOKEN="${RUNNER_TOKEN:-}"

              if [ -n "${GITHUB_PAT:-}" ]; then
                echo "Requesting runner registration token from GitHub API..."
                TOKEN_RESPONSE=$(curl -s -L -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${GITHUB_PAT}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/anil-sezer/Portfolio/actions/runners/registration-token")
                FETCHED_TOKEN=$(echo "${TOKEN_RESPONSE}" | jq -r '.token // empty')
                if [ -n "${FETCHED_TOKEN}" ]; then
                  REG_TOKEN="${FETCHED_TOKEN}"
                else
                  echo "Warning: Could not fetch registration token using GITHUB_PAT. Response: ${TOKEN_RESPONSE}"
                fi
              fi

              if [ -z "${REG_TOKEN}" ]; then
                echo "Error: Neither valid GITHUB_PAT nor RUNNER_TOKEN was provided."
                exit 1
              fi

              echo "Configuring GitHub Actions runner ${RUNNER_NAME}..."
              ./config.sh \
                --url "${GITHUB_REPO_URL}" \
                --token "${REG_TOKEN}" \
                --name "${RUNNER_NAME}" \
                --labels "${RUNNER_LABELS}" \
                --work "_work" \
                --unattended \
                --replace

              unset GITHUB_PAT
              unset REG_TOKEN
              unset RUNNER_TOKEN

              echo "Starting GitHub Actions runner..."
              ./run.sh &
              RUNNER_PID=$!
              wait ${RUNNER_PID}
          env:
            - name: GITHUB_REPO_URL
              value: "https://github.com/anil-sezer/Portfolio"
            - name: RUNNER_NAME
              value: "k8s-pi-portfolio-runner"
            - name: RUNNER_LABELS
              value: "self-hosted,linux,ARM64"
            - name: TZ
              value: "Europe/Istanbul"
            - name: PATH
              value: "/opt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: github-runner-secret
                  key: GITHUB_PAT
                  optional: true
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-secret
                  key: RUNNER_TOKEN
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: kubectl-bin
              mountPath: /opt/bin
            - name: runner-work
              mountPath: /home/runner/_work
      volumes:
        - name: kubectl-bin
          emptyDir: {}
        - name: runner-work
          emptyDir: {}
