---
# Verifies that:
# 1. All cluster nodes report Allocatable CPU < Capacity CPU (reflecting kubeReserved + systemReserved).
# 2. All cluster nodes report Allocatable Memory < Capacity Memory by at least the reserved amount (~1.3GiB).
# 3. Kubelet configuration file /var/lib/kubelet/config.yaml contains systemReserved, kubeReserved, and evictionHard.

- name: Retrieve cluster nodes resource specifications
  ansible.builtin.command: kubectl get nodes -o json
  register: nodes_resources_raw
  changed_when: false
  become: false

- name: Parse cluster nodes resource specifications
  ansible.builtin.set_fact:
    cluster_nodes_info: "{{ (nodes_resources_raw.stdout | from_json)['items'] }}"

- name: Verify all nodes have reserved CPU and Memory deducted from Allocatable
  ansible.builtin.assert:
    that:
      - item.status.allocatable.cpu != item.status.capacity.cpu
      - (item.status.allocatable.cpu | regex_search('^[0-9]+m$') is not none) or (item.status.allocatable.cpu | int < item.status.capacity.cpu | int)
    fail_msg: "Node {{ item.metadata.name }} does not have CPU reservations reflected in Allocatable (Cap: {{ item.status.capacity.cpu }}, Alloc: {{ item.status.allocatable.cpu }})!"
    success_msg: "Node {{ item.metadata.name }} has Allocatable CPU {{ item.status.allocatable.cpu }} (Capacity: {{ item.status.capacity.cpu }})."
    quiet: true
  loop: "{{ cluster_nodes_info }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Display Kubelet reservation verification summary
  ansible.builtin.debug:
    msg: "{{ item.metadata.name }}: CPU Cap={{ item.status.capacity.cpu }}, Alloc={{ item.status.allocatable.cpu }} | Memory Cap={{ item.status.capacity.memory }}, Alloc={{ item.status.allocatable.memory }}"
  loop: "{{ cluster_nodes_info }}"
  loop_control:
    label: "{{ item.metadata.name }}"
