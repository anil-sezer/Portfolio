# ── Logging ──────────────────────────────────────────────────────────────────
logs:
  general:
    level: INFO
  access:
    enabled: true

# ── Global args ───────────────────────────────────────────────────────────────
additionalArguments:
  - "--global.sendAnonymousUsage"

# ── Let's Encrypt (Cloudflare DNS challenge) ──────────────────────────────────
certificatesResolvers:
  letsencrypt-prod:
    acme:
      email: msnanil@hotmail.com
      storage: /data/acme.json
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 5

# ── Cloudflare API token (injected from a Secret) ────────────────────────────
env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token   # Remember to create this Secret
        key: token

# ── Persist acme.json so certs survive pod restarts ──────────────────────────
persistence:
  enabled: true
  name: data
  path: /data
  size: 128Mi
  storageClass: ""
  volumeName: traefik

deployment:
  initContainers:
    - name: fix-acme-permissions
      image: busybox
      command: ["sh", "-c", "touch /data/acme.json && chmod 600 /data/acme.json"]
      volumeMounts:
        - name: data
          mountPath: /data

# ── Dashboard ─────────────────────────────────────────────────────────────────
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.anil-sezer.com`)
    entryPoints:
      - websecure
    tls:
      certResolver: letsencrypt-prod
    middlewares:
      - name: forward-auth
        namespace: authentik

api:
  dashboard: true
#  insecure: false

# ── Providers ─────────────────────────────────────────────────────────────────
providers:
  kubernetesGateway:
    enabled: true
  kubernetesCRD:
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true

# ── Gateway ───────────────────────────────────────────────────────────────────
gateway:
  listeners:
    web:
      namespacePolicy:
        from: All

# ── Ports ─────────────────────────────────────────────────────────────────────
ports:
  web:
    port: 8000
    exposedPort: 80
    expose:
      default: true
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 8443
    exposedPort: 443
    expose:
      default: true
