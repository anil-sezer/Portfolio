apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adminer-ingress
  namespace: database
spec:
  podSelector:
    matchLabels:
      app: adminer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
