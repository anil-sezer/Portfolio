---
- name: Check if Kubernetes control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf_stat
  become: true

- name: Init with kubeadm
  when: not kubeadm_admin_conf_stat.stat.exists
  block:
    - name: Pull the images for kubeadm
      ansible.builtin.command: kubeadm config images pull
      changed_when: true
      become: true

    - name: Init the control node
      ansible.builtin.command: kubeadm init --pod-network-cidr={{ pod_network_cdr }}
      register: kubeadm_output
      changed_when: true
      become: true

    - name: Fetch the kubeadm init logs
      ansible.builtin.import_tasks: kubeadm-fetch-init-logs.yml
      vars:
        plane_name: control-plane

- name: Ensure .kube directory exists in the user's home directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.kube"
    state: directory
    mode: '0755'
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
  become: false

- name: Copy Kubernetes admin.conf to user's .kube/config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_facts['env']['HOME'] }}/.kube/config"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: '0600'
    remote_src: true
  when: kubeadm_admin_conf_stat.stat.exists or not ansible_check_mode
  become: true

- name: Fetch kube config file
  ansible.builtin.fetch:
    src: "{{ ansible_facts['env']['HOME'] }}/.kube/config"
    dest: "{{ ansible_facts['env']['HOME'] }}/.kube/"
    flat: true
  when: kubeadm_admin_conf_stat.stat.exists or not ansible_check_mode
  become: false

- name: Pause for 5 seconds after control plane initialization
  ansible.builtin.pause:
    seconds: 5
  when: kubeadm_output is defined and kubeadm_output is changed

- name: Install CNI (Flannel)
  ansible.builtin.command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  register: flannel_apply_result
  changed_when: "'configured' in flannel_apply_result.stdout or 'created' in flannel_apply_result.stdout"
  become: false

- name: Install cert-manager to control plane
  ansible.builtin.command: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.20.2/cert-manager.yaml
  register: cert_manager_apply_result
  changed_when: "'configured' in cert_manager_apply_result.stdout or 'created' in cert_manager_apply_result.stdout"
  become: false

- name: Keep CoreDNS replicas on worker nodes only by removing control-plane toleration
  ansible.builtin.command: >-
    kubectl patch deployment coredns -n kube-system --type=json
    -p '[{"op": "replace", "path": "/spec/template/spec/tolerations", "value": [{"key": "CriticalAddonsOnly", "operator": "Exists"}]}]'
  register: coredns_patch_result
  changed_when: "'patched' in coredns_patch_result.stdout and '(no change)' not in coredns_patch_result.stdout"
  failed_when: coredns_patch_result.rc != 0
  become: false
