---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: db-backup-portfolio-nfs
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.2
    - wsize=131072
    - rsize=131072
    - hard
  nfs:
    server: 192.168.1.119
    path: /mnt/nas/disk/k8s/db-backups/db-backups/postgres/portfolio
