---
- name: Ensure a directory for apt keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Install core components and utilities
  ansible.builtin.apt:
    name:
      - gpg
      - git
      - curl
      - wget
      - unzip
      - ca-certificates
      - bzip2
    state: present
    update_cache: true
  become: true
