apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elastic-operator-ingress
  namespace: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elastic-operator
  policyTypes:
    - Ingress
  ingress:
    # Control-plane kube-apiserver admission webhook traffic (pi4-red host IP + flannel.1/cni0 SNAT IPs)
    - from:
        - ipBlock:
            cidr: 192.168.1.120/32
        - ipBlock:
            cidr: 10.244.0.0/31
      ports:
        - protocol: TCP
          port: 9443
