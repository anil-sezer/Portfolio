---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: images-nfs
  namespace: image-registry
spec:
  capacity:
    storage: 40Gi
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.2
    - wsize=131072
    - rsize=131072
    - hard
  nfs:
    server: 192.168.1.119
    path: /mnt/nas/disk/k8s/image-registry
