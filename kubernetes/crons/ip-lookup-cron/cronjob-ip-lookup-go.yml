---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ip-lookup-go-cronjob
  namespace: portfolio
spec:
  schedule: "*/20 * * * *"  # Runs every 20 minutes
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: ip-lookup-go-app
              image: anilsezer/iplookup-cron-go:latest
              env:
              - name: GRPC_BASE_URL
                value: "portfolio-grpc-service.portfolio.svc.cluster.local:8080"

          restartPolicy: Never
