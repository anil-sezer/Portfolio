---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: get-daily-images
  namespace: portfolio
spec:
  schedule: "0 2 * * *"  # Every day at 02:00 (2:00 AM)
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: get-daily-images
        spec:
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: regcred
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: wait-for-netpol
              image: busybox:1.37
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "sleep 3"]
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
          containers:
            - name: get-daily-images
              image: imgregistry.anil-sezer.com/get-daily-images-go-cron:latest
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: GRPC_BASE_URL
                  value: "grpc.portfolio.svc.cluster.local:8080"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
          restartPolicy: Never
