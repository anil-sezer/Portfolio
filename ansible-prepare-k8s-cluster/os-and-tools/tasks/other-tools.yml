---
- name: Install Git.
  ansible.builtin.apt:
    state: present
    name: git

# https://github.com/bootandy/dust
- name: Check if dust is already installed.
  ansible.builtin.command: dust --version
  register: dust_rc
  failed_when: false
  changed_when: false

- name: Install dust.
  ansible.builtin.unarchive:
    src: "https://github.com/bootandy/dust/releases/download/{{ dustversion }}/dust-{{ dustversion }}-aarch64-unknown-linux-gnu.tar.gz"
    dest: /usr/local/bin
    extra_opts:
      - --strip=1
      - --wildcards
      - '*/dust'
    remote_src: true
  when: dust_rc.rc != 0

# https://github.com/eza-community/eza
- name: Check if eza is already installed.
  ansible.builtin.command: eza --version
  register: eza_rc
  failed_when: false
  changed_when: false

- name: Install Eza.
  ansible.builtin.import_tasks: eza.yml
  when: eza_rc.rc != 0

# https://github.com/sharkdp/fd
- name: Install fd-find
  ansible.builtin.apt:
    state: present
    pkg: fd-find

- name: Create link fd to fdfind
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/bin/fd
    state: link

# https://github.com/sharkdp/bat
- name: Install bat
  ansible.builtin.apt:
    state: present
    pkg: bat

- name: Create link bat to batcat in Debian
  ansible.builtin.file:
    src: /usr/bin/batcat
    dest: /usr/bin/bat
    state: link

# https://github.com/ajeetdsouza/zoxide
- name: Install zoxide
  ansible.builtin.apt:
    state: present
    pkg: zoxide

# required by the OMZ plugin zsh-interactive-cd
- name: Install fzf (command-line fuzzy finder)
  ansible.builtin.apt:
    state: present
    pkg: fzf

- name: Install procs
  ansible.builtin.package:
    name: procs
    state: present
    use: snap

- name: Install unzip
  ansible.builtin.apt:
    state: present
    pkg: unzip

# https://github.com/BurntSushi/ripgrep
- name: Install ripgrep
  ansible.builtin.apt:
    state: present
    pkg: ripgrep
