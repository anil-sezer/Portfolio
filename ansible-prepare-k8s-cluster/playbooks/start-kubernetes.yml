---
- name: Start Kubernetes and exit maintenance mode
  hosts: k8s_nodes
  gather_facts: true
  tasks:
    # -------------------------------------------------------------------------
    # Step 1: Start containerd on all nodes
    # -------------------------------------------------------------------------
    - name: Ensure containerd service is started
      ansible.builtin.systemd:
        name: containerd
        state: started
      become: true

    # -------------------------------------------------------------------------
    # Step 2: Start kubelet on control plane host first
    # -------------------------------------------------------------------------
    - name: Start kubelet on control plane host
      ansible.builtin.systemd:
        name: kubelet
        state: started
      become: true
      when: inventory_hostname in groups['control_node']

    - name: Wait for Kubernetes API server to become ready
      ansible.builtin.import_tasks: ../tasks/kubernetes-maintenance/wait-for-api.yml
      when: inventory_hostname in groups['control_node']

    # -------------------------------------------------------------------------
    # Step 3: Start kubelet on worker nodes
    # -------------------------------------------------------------------------
    - name: Start kubelet on worker nodes
      ansible.builtin.systemd:
        name: kubelet
        state: started
      become: true
      when: inventory_hostname in groups['worker_node']

    # -------------------------------------------------------------------------
    # Step 4: Uncordon all nodes from control plane
    # -------------------------------------------------------------------------
    - name: Uncordon Kubernetes nodes
      ansible.builtin.import_tasks: ../tasks/kubernetes-maintenance/uncordon-cluster.yml
      when: inventory_hostname in groups['control_node']
