syntax = "proto3";

option csharp_namespace = "Portfolio.Grpc";

package client_info;

import "google/protobuf/empty.proto";

service K8sStats {
  rpc Get (google.protobuf.Empty) returns (GetK8sStatsResponse);
}

message GetK8sStatsResponse {
  int32 active_pod_count = 1;
  int32 service_count = 2;
  int32 node_count = 3;
  int32 deployment_count = 4;
  int32 cron_job_count = 5;
}